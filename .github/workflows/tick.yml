name: tick

on:
  schedule:
    # Every 30 minutes, 08:00-23:30 Tashkent time (03:00-18:30 UTC).
    - cron: "*/30 3-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one tick
        env:
          PW_CHANNEL: chrome   # use the runner's preinstalled Chrome, no download
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}   # optional; default is public GitHub URLs
        run: python -m bot.tick
      - name: Save state
        if: always()
        run: |
          git config user.name "otbozor-bot"
          git config user.email "otbozor-bot@users.noreply.github.com"
          git add data drafts
          git diff --cached --quiet || git commit -m "tick: update state"
          git push

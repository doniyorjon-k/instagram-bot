name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Render sample slides
        env:
          PW_CHANNEL: chrome
        run: |
          python -c "import json; from pathlib import Path; from bot.render import render; print(render(json.load(open('tests/fixtures/sample_content.json')), Path('preview')))"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-slides
          path: preview/
